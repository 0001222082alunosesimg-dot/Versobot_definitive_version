 html_pagina = """
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Verso.AI - Chat</title>
        <style>
            body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
            .conteiner { max-width: 500px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
            input[type="text"] { width: 80%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
            button { padding: 10px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
            button:hover { background-color: #218838; }
            .resposta-box { margin-top: 20px; padding: 15px; background-color: #e9ecef; border-radius: 4px; display: none; font-weight: bold; }
        </style>
    </head>
    <body>
        <div class="conteiner">
            <h1>Bem-vindo ao verso.AI</h1>
            <p>Digite sua mensagem abaixo:</p>
            
            <input type="text" id="campoMensagem" placeholder="Escreva algo para a IA...">
            <br>
            <button onclick="enviarMensagem()">Enviar</button>
            
            <div id="caixaResposta" class="resposta-box"></div>
        </div>

        <script>
            function enviarMensagem() {
                var campo = document.getElementById("campoMensagem");
                var texto = campo.value.trim();
                var caixaResposta = document.getElementById("caixaResposta");
                
                if (texto === "") {
                    alert("Por favor, digite alguma coisa!");
                    return;
                }
                
                fetch('/blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mensagem: texto })
                })
                .then(response => response.json())
                .then(dados => {
                    caixaResposta.innerText = dados.resposta;
                    caixaResposta.style.display = "block";
                    campo.value = "";
                })
                .catch(erro => {
                    console.error('Erro:', erro);
                    alert("Erro ao falar com a IA.");
                });
            }
        </script>
    </body>
    </html>
    """
