<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El grande VersoBot!</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; display: flex; flex-direction: column; }
        .message { margin: 10px 0; padding: 8px 12px; border-radius: 4px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #d1e7dd; align-self: flex-end; margin-left: auto; text-align: right; }
        .bot-msg { background: #e2e3e5; align-self: flex-start; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Conversa com VersoBot</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Digite uma mensagem para iniciar.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." onkeypress="handleKeyPress(event)">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>

<script>
const historicoRespostas = {
    saudacoes: [],
    despedidas: [],
    IA: [],
    azar: [],
    piadas: [],
    risadas: [],
    politicas: [],
    risadas: []
};

const bancoDados = {
    saudacoes: {
        chaves: ['oi', 'ola', 'olá', 'opa', 'bom', 'bão', 'bao', 'hola', 'hi', 'hello'],
        respostas: ['Oi, tudo bem?', 'Hola! Como vai?', 'Olá, como posso ajudá-lo?', 'Opa! No que posso ajudar?', 'No que posso servir?']
    },
    despedidas: {
        chaves: ["tchau", "adeus", "falou", 'fui', 'até mais', 'até logo'],
        respostas: ['Tchau', 'Adeus', 'Adios, mi amigo', 'Tchauzinho', 'Falou, rapá!']
    },
    IA: {
        chaves: ['ia', 'ai', 'artificial', 'artificiais'],
        respostas: [
            'Segundo a PUCRS, a IA em sua essência é a capacidade das máquinas de pensar como seres humanos. Ou seja, aprender, perceber e decidir quais caminhos seguir, de forma racional, diante de determinadas situações.',
            'Segundo a AMAZON, a Inteligência Artificial (IA) é uma tecnologia transformadora que permite que as máquinas realizem tarefas de resolução de problemas semelhantes às humanas. Desde o reconhecimento de imagens e a geração de conteúdo criativo até a realização de previsões orientadas por dados, a IA permite que as empresas tomem decisões mais inteligentes em grande escala.'
        ]
    },
    azar: {
        chaves: ['impacta', 'impacto', 'importância', 'importante', 'desafio', 'contras'],
        respostas: [
            'Segundo o SENAC, as IAs têm tirado muita responsabilidade humana de decisões que deveriam ser tomadas por eles, o que cria certa acomodação nas pessoas.',
            'Segundo o SENAC, Um dos principais desafios que a IA nos impõe é o descompasso considerável entre o avanço tecnológico e a nossa capacidade de avaliar novas tecnologias.',
            'Segundo o Quantum Records, um portal digital científico sem fins lucrativos, a IA (Inteligência Artificial) atrapalha no desenvolvimento cognitivo da população, pois cria uma acomodação ao pensamento assistido.'
        ]
    },
    piadas: {
        chaves: ['piada', 'piadas', 'humor', 'comédia', 'comedia'],
        respostas: [
            'Sabe por que a galinha atravessou a rua? Para ver a missa do galo!(e todos riem)',
            'Um empregado falou para o chefe: "É melhor o senhor me dar um aumento logo, pois saiba o senhor que tem três empresas atrás de mi...", então o chefe perguntou: "Que empresas?". Duas horas depois, o funcionário estava na rua por ter respondido "A CEMIG, a COPASA e a TIM"',
            'Fiquei confuso depois da aula de inglês. Se “car” significa carro e “men” significa “homens”, então minha tia Carmen é um Transformer?',
            'Um caipira chega à casa de um amigo que estava vendo TV e pergunta: E aí, firme? O outro responde: Não, futebor!',
            '"Alô, eu gostaria de falar com o João, por favor.". "É o próprio.". "Oi, é o Próprio falando?". "Sim!". "Passa pro João, por favor."',
            'Tinha dois caminhões voando. Um deles caiu. Por que o outro continuou voando? Porque era caminhão-pipa.',
            'O bêbado atravessa a rua fora da faixa e um carro buzina para ele: “Bi-bi!”. O bêbado responde: “Eu também bibi, e não foi pouco não”.',
            'Por que a aranha é o animal mais carente do mundo? Porque ela é um aracneedyou (kitunts).'
        ]
    },
    politicas: {
        chaves: ['guerra', 'presidente', 'eleições', 'eleiçoes', 'voto', 'vota', 'votar', 'candidato', 'político', 'politico'],
        respostas: ['Prefiro não me meter nesse assunto. Que tal perguntar sobre IAs?']
    },
    risadas: {
        chaves: ['kkk', 'kjkj', 'hahaha', 'haha', 'ha'],
        respostas: ['Ha! Te fiz rir.', 'Não precisa disso, eu sei que sou el melhor', 'Yo soy el mas divertido del Brasil.', 'Isso foi por que você ouviu a mais sem graça.', 'Rindo do quê? Não tem graça...']
    }
}; 

function escolherResposta(categoria, respostasLista) {
    let usadas = historicoRespostas[categoria];
    let disponiveis = respostasLista.filter(r => !usadas.includes(r));

    if (disponiveis.length === 0) {
        historicoRespostas[categoria] = [];
        disponiveis = respostasLista;
    }

    let resposta = disponiveis[Math.floor(Math.random() * disponiveis.length)];
    historicoRespostas[categoria].push(resposta);
    return resposta;
}

function contemExpressao(mensagem, expressao) {
    const padrao = new RegExp(`(?<!\\w)${expressao.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}(?!\\w)`, 'i');
    return padrao.test(mensagem);
}

function obterRespostaBot(mensagem) {
    if (bancoDados.saudacoes.chaves.some(s => contemExpressao(mensagem, s))) {
        return escolherResposta('saudacoes', bancoDados.saudacoes.respostas);
    } else if (bancoDados.despedidas.chaves.some(d => contemExpressao(mensagem, d))) {
        return escolherResposta('despedidas', bancoDados.despedidas.respostas);
    } else if (bancoDados.IA.chaves.some(i => contemExpressao(mensagem, i))) {
        return escolherResposta('IA', bancoDados.IA.respostas);
    } else if (bancoDados.azar.chaves.some(a => contemExpressao(mensagem, a))) {
        return escolherResposta('azar', bancoDados.azar.respostas);
    } else if (bancoDados.piadas.chaves.some(c => contemExpressao(mensagem, c))) {
        return escolherResposta('piadas', bancoDados.piadas.respostas);
    } else if (bancoDados.politicas.chaves.some(p => contemExpressao(mensagem, p))) {
        return escolherResposta('politicas', bancoDados.politicas.respostas);
    } else if (bancoDados.risadas.chaves.some(r => contemExpressao(mensagem, r))) {
        return escolherResposta('risadas', bancoDados.risadas.respostas);
    }
    
    return "Não tenho acervo suficiente para responder essa pergunta. Por favor, faça perguntas abrangentes sobre o tema do trabalho.";
}

function enviarMensagem() {
    const input = document.getElementById('userInput');
    const mensagemUsuario = input.value.trim();
    if (!mensagemUsuario) return;

    const chatBox = document.getElementById('chatBox');

    chatBox.innerHTML += `<div class="message user-msg">${mensagemUsuario}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
        const respostaBot = obterRespostaBot(mensagemUsuario);
        chatBox.innerHTML += `<div class="message bot-msg">${respostaBot}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 500);
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        enviarMensagem();
    }
}
</script>

</body>
</html>
