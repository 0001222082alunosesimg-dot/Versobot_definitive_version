<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El grande VersoBot!</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; }
        .chat-box { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; display: flex; flex-direction: column; }
        .message { margin: 10px 0; padding: 8px 12px; border-radius: 4px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: #d1e7dd; align-self: flex-end; margin-left: auto; text-align: right; }
        .bot-msg { background: #e2e3e5; align-self: flex-start; text-align: left; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Conversa com VersoBot</h2>
    <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Digite uma mensagem para iniciar.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Digite sua mensagem aqui..." onkeypress="handleKeyPress(event)">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>
</div>
<button onclick="oi">oi</button>

<script src="./script.js"></script>

</body>
</html>
